plugins {
    id 'net.minecraftforge.gradle' version '5.1.77'
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.matching { it.name == 'reobfJar' }.configureEach {
    enabled = false
}

// The common JAR is not a release artifact; reobfuscating it in place would leave Forge names in the
// JAR that the Fabric dev runs load.
tasks.matching { it.name == 'reobfJar' }.configureEach {
    enabled = false
}
